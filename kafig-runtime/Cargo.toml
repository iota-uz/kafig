[package]
name = "kafig-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
rquickjs = { version = "0.11.0", features = [
    "std",
    "classes",
    "properties",
    "array-buffer",
    "either",
    "macro",
] }

# Deterministic release profile for runtime.wasm.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
debug = false
strip = "debuginfo"
incremental = false
